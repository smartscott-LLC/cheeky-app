# Apex handler: smartscott.online → redirect to www (while www still lives on
# Vercel) — and one flip later, this same route serves the club from Ivy.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: apex-to-www
  namespace: platform
spec:
  redirectRegex:
    regex: ^https?://smartscott\.online(:\d+)?(/.*)?$
    replacement: https://www.smartscott.online${2}
    permanent: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apex
  namespace: platform
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: platform-apex-to-www@kubernetescrd
spec:
  rules:
    - host: smartscott.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: noop
                port:
                  number: 80
---
# Traefik needs a backend object to exist even though the middleware
# short-circuits every request with a redirect.
apiVersion: v1
kind: Service
metadata:
  name: noop
  namespace: platform
spec:
  ports:
    - port: 80
      targetPort: 80
