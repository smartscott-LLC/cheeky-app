# Apex handler: smartscott.online → redirect to www. Lives in the club
# namespace (re-homed 2026-10-07 after the platform/whoami teardown) —
# Traefik's own noop service satisfies the backend requirement while the
# redirectRegex middleware short-circuits every request.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: apex-to-www
  namespace: club
spec:
  redirectRegex:
    regex: ^https?://smartscott\.online(:\d+)?(/.*)?$
    replacement: https://www.smartscott.online${2}
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: apex
  namespace: club
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`smartscott.online`)
      kind: Rule
      middlewares:
        - name: apex-to-www
      services:
        # Cluster-internal Traefik noop: never reached when the redirect
        # middleware fires, but the router requires a backend to exist.
        - name: noop
          port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: noop
  namespace: club
spec:
  ports:
    - port: 80
      targetPort: 9
