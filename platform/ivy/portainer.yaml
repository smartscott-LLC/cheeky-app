# Portainer CE on Ivy — LAN-only ops UI.
# Login is deterministic: --admin-password-file creates the admin at boot
# (the 5-minute first-run window is what caused the 403 dance). The agent
# RBAC below is what the "Add environment > Kubernetes > Agent" wizard
# expects, pre-applied so its one-paste manifest lands clean.
# Password secret created on-box, NEVER committed:
#   kubectl -n portainer create secret generic portainer-admin \
#     --from-file=admin.txt=$HOME/portainer-admin.txt
apiVersion: v1
kind: Namespace
metadata:
  name: portainer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portainer
  namespace: portainer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portainer
  template:
    metadata:
      labels:
        app: portainer
    spec:
      containers:
        - name: portainer
          image: portainer/portainer-ce:latest
          # Stock listeners (HTTP :9000 + tunnel :8000) + deterministic admin:
          # no 5-minute creation window, restart-proof (that was the 403).
          args:
            - --admin-password-file
            - /run/admin/admin.txt
          ports:
            - containerPort: 9000
            - containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /data
            - name: admin-pass
              mountPath: /run/admin
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "512Mi"
      volumes:
        - name: admin-pass
          secret:
            secretName: portainer-admin
        - name: data
          persistentVolumeClaim:
            claimName: portainer-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portainer-data
  namespace: portainer
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: portainer
  namespace: portainer
spec:
  type: NodePort
  selector:
    app: portainer
  ports:
    # Plain HTTP on LAN :30000 (--bind :9000) — no self-signed prompt for a
    # LAN-only UI. (Binary lesson: --bind = listen, --host = env to manage,
    # --admin-password-file = hashed password in the file.)
    - name: http
      port: 9000
      targetPort: 9000
      nodePort: 30000
    - name: edge
      port: 8000
      targetPort: 8000
      nodePort: 30776
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portainer-agent-sa
  namespace: portainer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portainer-agent-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: portainer-agent-sa
    namespace: portainer
